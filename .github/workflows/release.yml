# Cut a release. THE TAG IS AN OUTPUT OF THIS WORKFLOW, NEVER AN INPUT TO IT.
#
# 1. Bump "version" in package.json (and package-lock.json) in a reviewed PR, with a
#    `## vX.Y.Z — YYYY-MM-DD` section at the top of CHANGELOG.md.
# 2. Dispatch this workflow. It derives the tag from package.json, refuses a version that
#    is already released or a CHANGELOG that does not name it, runs the checks, and only
#    then creates the tag and the GitHub release (the one irreversible act, last).
#
# Shells pin `"@stromy/portal-kit": "github:stromy-org/portal-kit#vX.Y.Z"`.
name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every gate and report the version, then stop without tagging"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::release runs from main only"
          exit 1
      - name: Derive the version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          lock=$(node -p "require('./package-lock.json').version")
          [ "$version" = "$lock" ] || { echo "::error::package.json $version != package-lock.json $lock"; exit 1; }
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag is already released; bump the version first"; exit 1
          fi
          head=$(grep -m1 -E '^## v[0-9]+\.[0-9]+\.[0-9]+ — [0-9]{4}-[0-9]{2}-[0-9]{2}$' CHANGELOG.md | sed -E 's/^## (v[^ ]+).*/\1/')
          [ "$head" = "$tag" ] || { echo "::error::CHANGELOG.md tops at '$head', expected $tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Tag and publish the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          notes=$(awk -v t="## $TAG" 'index($0,t)==1{f=1;next} /^## v/{if(f)exit} f' CHANGELOG.md)
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "$notes"
